add_newline = true
command_timeout = 1000

format = """
$os$directory$git_branch$git_state$git_status
$character"""

[os]
disabled = false
format = "[$symbol]($style)"
style = "fg:#1793D1"   # azzurro Arch Linux

[os.symbols]
Arch = "󰣇 "
CachyOS = "󰣇 "

# p10k: DIR_FOREGROUND=31, ANCHOR=39 (radice del repository), parent abbreviati
[directory]
style = "fg:31"
repo_root_style = "bold fg:38"
truncation_length = 3
truncate_to_repo = false
fish_style_pwd_dir_length = 2
read_only = " "
read_only_style = "fg:160"

[git_branch]
symbol = "󰘬 "
format = "[$symbol$branch]($style) "
style = "italic fg:37"

[git_state]
style = "fg:196"
format = ' [$state( $progress_current/$progress_total)]($style)'

[git_status]
format     = '[$all_status$ahead_behind]($style)'
style      = "fg:76"
ahead      = "[⇡${count}](fg:purple) "
diverged   = "[⇕⇡${ahead_count}⇣${behind_count}](fg:purple) "
behind     = "[⇣${count}](fg:purple) "
conflicted = "[ ](fg:196)"
up_to_date = "[ ](fg:76)"
untracked  = "[? ](fg:208)"
modified   = "[ ](fg:178)"
stashed    = ""
staged     = ""
renamed    = ""
deleted    = ""

[character]
success_symbol = "[❯](bold fg:#7ACEA4)"
error_symbol = "[❯](bold fg:196)"
vimcmd_symbol = "[❮](bold fg:#7ACEA4)"
