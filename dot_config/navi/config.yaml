style:
  tag:
    color: green
    width_percentage: 12
    min_width: 12
  comment:
    color: blue
    width_percentage: 78  # tag+comment+separatori < 100%, altrimenti fzf tronca con "··"
  snippet:
    color: white

finder:
  command: fzf
  # fzf non può mettere la preview tra prompt e lista: uso l'header (in reverse sta lì),
  # riscritto a ogni spostamento da header.sh: descrizione + comando, a capo alla larghezza
  overrides: --with-nth 1,2 --layout=reverse --preview-window=hidden --header-border=rounded --bind 'focus:transform-header($HOME/.config/navi/header.sh {5} {6})'

shell:
  command: zsh
