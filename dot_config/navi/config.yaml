style:
  tag:
    color: green
    width_percentage: 12
    min_width: 12
  comment:
    color: blue
    width_percentage: 78  # tag+comment+separatori < 100%, altrimenti fzf tronca con "··"
  snippet:
    color: white

finder:
  command: fzf
  # fzf non può mettere la preview tra prompt e lista: uso l'header (in reverse sta lì),
  # riscritto a ogni spostamento con la riga del comando di "navi preview"
  overrides: --with-nth 1,2 --layout=reverse --preview-window=hidden --header-border=rounded --bind 'focus:transform-header(navi preview {} | sed -n 2p)'

shell:
  command: zsh
