# vim: set sw=4 ts=4 sts=4 et tw=120 foldmarker={{{,}}} foldmethod=marker nospell:

# Performance {{{
    repaint_delay 10
    sync_to_monitor yes
# }}} Performance

# Resolve Bug {{{
    # Risolve problema crach ridimensionamento in Hyprland
    # resize running program instantly
    # resize_debounce_time 0 0
    # prevents jiggly text due to previous line
    placement_strategy top-left
# }}} Resolve Bug

# Setting {{{
    enable_audio_bell no
    visual_bell_duration 1
    confirm_os_window_close 0
    inactive_text_alpha 0.85
    background_opacity 1
    allow_remote_control yes
    listen_on unix:/tmp/kitty-{kitty_pid}
    copy_on_select yes
    clipboard_control write-clipboard write-primary
    # Necessari perché il plugin pilota Kitty da fuori (remote control su socket)
    shell_integration enabled
    # Barra which-key in basso: mostra i tasti della keyboard mode attiva
    watcher ~/.config/kitty/plugins/whichkey_dock.py
# }}} Setting

# Window Visual {{{
    enabled_layouts splits:split_axis=horizontal,tall:bias=50;full_size=1;mirrored=false,vertical,horizontal,grid,fat,stack
    window_border_width 1.0
    window_padding_width 2.0 4.0 4.0 4.0
    # padding: top right bottom left (in alto la metà: meno spazio sotto la barra delle tab)
    window_margin_width 2.0
    single_window_margin_width -1
    draw_minimal_borders no
    active_border_color #86D3FB
    placement_strategy center
    scrollbar_width 0.7
    scrollbar_hover_width 1.2
    # Pager dello scrollback: senza LESSUTFCHARDEF less mostra le icone Nerd Font (uso privato) come <U+E5FF>
    scrollback_pager env LESSUTFCHARDEF=E000-F8FF:p,F0000-FFFFD:p,100000-10FFFD:p less --chop-long-lines --RAW-CONTROL-CHARS --IGNORE-CASE +INPUT_LINE_NUMBER
    # hide_window_decorations titlebar-only
# }}} Window Visual

# Tab {{{
    tab_bar_edge top
    tab_bar_style fade
    tab_bar_min_tabs 2
    tab_title_max_length 0
    tab_bar_margin_width 10.0
    tab_bar_margin_height 4.0 2.0
    tab_bar_margin_color #192330
    # Inactive Tab. {tab.program_status}: stato OSC 7501 di Claude Code; {custom}: draw_title() in tab_bar.py
    tab_title_template "{index}: {tab.program_status}{custom}"
    # Tab attivo: mostra il nome della keyboard mode (i tasti sono nella barra whichkey_dock.py)
    active_tab_title_template "{index}: {tab.program_status}{custom}{fmt.fg.tab} {fmt.fg.blue}{keyboard_mode}"
# }}} Tab

# Keyboard mappings {{{
    # Nessuna scorciatoia di default di kitty: valgono solo le map qui sotto
    clear_all_shortcuts yes
    #toggle_maximized
    #kitty_mod ctrl+shift

    # New Window istance
    map kitty_mod+n new_os_window_with_cwd
    # kitty-scrollback.nvim Kitten alias
    action_alias kitty_scrollback_nvim kitten '/home/ichelema/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py'
    # Browse scrollback buffer in nvim
    map kitty_mod+/ kitty_scrollback_nvim
    # Browse output of the last shell command in nvim
    map kitty_mod+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
    # ctrl+shift mouse destro mostra output di quel comando in Noevim 
    mouse_map ctrl+shift+right press ungrabbed combine : mouse_select_command_output : kitty_scrollback_nvim --config ksb_builtin_last_visited_cmd_output

    # Apre la ricerca incrementale live
    map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten plugins/search.py @active-kitty-window-id

    # Scroll Page
    map PageUp      scroll_line_up
    map PageDown    scroll_line_down

    # Copy/paste
    map kitty_mod+c copy_to_clipboard
    map kitty_mod+v paste_from_clipboard

    # Incolla dalla PRIMARY con middle click
    mouse_map middle release ungrabbed paste_from_selection

    map ctrl+shift+q quit

    # Change copy and paste map
    map ctrl+c copy_or_interrupt
    map ctrl+v paste_from_clipboard

    # Focus tra finestre del tab, oltre alla modalità alt+w.
    # Sostituiscono i default ctrl+shift+←/→ (tab precedente/successivo) e ctrl+shift+↑/↓ (scroll di riga)
    map ctrl+shift+left neighboring_window left
    map ctrl+shift+right neighboring_window right
    map ctrl+shift+up neighboring_window up
    map ctrl+shift+down neighboring_window down
    # alt+frecce: dentro zellij passano a zellij (focus tra i pannelli), fuori spostano tra le finestre di kitty
    map alt+left kitten plugins/zellij_nav.py left
    map alt+right kitten plugins/zellij_nav.py right
    map alt+up kitten plugins/zellij_nav.py up
    map alt+down kitten plugins/zellij_nav.py down

    # Window Mode {{{
        map --new-mode window alt+w --on-unknown passthrough
        map --new-mode window_new alt+w>n --on-unknown passthrough
        map --new-mode resize alt+w>r --on-unknown passthrough

        map alt+w push_keyboard_mode window

        map --mode window n combine : push_keyboard_mode window_new

        # New window vsplit
        map --mode window_new l combine : pop_keyboard_mode : pop_keyboard_mode :  launch --location=vsplit
        map --mode window_new right combine : pop_keyboard_mode : pop_keyboard_mode : launch --location=vsplit

        # New window hsplit
        map --mode window_new j  combine : pop_keyboard_mode : pop_keyboard_mode : launch --location=hsplit
        map --mode window_new down  combine : pop_keyboard_mode : pop_keyboard_mode : launch --location=hsplit

        # Focus Left
        map --mode window h  combine : pop_keyboard_mode : pop_keyboard_mode : neighboring_window left
        map --mode window left  combine : pop_keyboard_mode : neighboring_window left
        # Focus Right
        map --mode window l combine : pop_keyboard_mode : neighboring_window right
        map --mode window right combine : pop_keyboard_mode : neighboring_window right
        # Focus Down
        map --mode window j combine : pop_keyboard_mode : neighboring_window down
        map --mode window down combine : pop_keyboard_mode : neighboring_window down
        # Focus Up
        map --mode window k combine : pop_keyboard_mode : neighboring_window up
        map --mode window up combine : pop_keyboard_mode : neighboring_window up

        map --mode window m combine : pop_keyboard_mode : toggle_layout stack

        # Close window
        map --mode window c combine : pop_keyboard_mode : close_window

        # Entra in modalità resize da window mode
        map --mode window r combine : push_keyboard_mode resize
        map --mode resize h resize_window narrower 2
        map --mode resize left combine : resize_window narrower 2

        map --mode resize l combine : resize_window wider 2
        map --mode resize right combine : resize_window wider 2

        map --mode resize j combine : resize_window shorter 2
        map --mode resize down combine : resize_window shorter 2

        map --mode resize k combine : resize_window taller 2
        map --mode resize up combine : resize_window taller 2

        # Exit window mode
        map --mode window esc pop_keyboard_mode
        map --mode window enter pop_keyboard_mode

        # Exit window_new mode
        map --mode window_new esc combine : pop_keyboard_mode : pop_keyboard_mode

        # Exit resize mode
        map --mode resize esc combine : pop_keyboard_mode : pop_keyboard_mode
    # }}} Window Mode

    # Tab Mode {{{

        map --new-mode tab alt+t --on-unknown passthrough
        map --new-mode tab_move alt+t>m --on-unknown passthrough
        # map --new-mode tab_move alt+t>r --on-unknown passthrough

        map alt+t push_keyboard_mode tab

        # New Tab
        map --mode tab n combine : pop_keyboard_mode : new_tab

        # Focus Left
        map --mode tab h combine : pop_keyboard_mode : previous_tab
        map --mode tab left combine : pop_keyboard_mode : previous_tab
        # Focus Right
        map --mode tab l combine : pop_keyboard_mode : next_tab
        map --mode tab right combine : pop_keyboard_mode : next_tab

        map --mode tab 1 combine : pop_keyboard_mode : goto_tab 1
        map --mode tab 2 combine : pop_keyboard_mode : goto_tab 2
        map --mode tab 3 combine : pop_keyboard_mode : goto_tab 3
        map --mode tab 4 combine : pop_keyboard_mode : goto_tab 4
        map --mode tab 5 combine : pop_keyboard_mode : goto_tab 5

        map --mode tab d combine : pop_keyboard_mode : detach_tab ask

        # Close window
        map --mode tab c combine : pop_keyboard_mode : close_tab

        # Rename tab (prompt interattivo: chiede il nome)
        map --mode tab r combine : pop_keyboard_mode : set_tab_title

        # Entra in modalità move da tab move
        map --mode tab m push_keyboard_mode tab_move

        # Move (stay in tab_move)
        map --mode tab_move left  move_tab_backward
        map --mode tab_move right move_tab_forward
        map --mode tab_move h     move_tab_backward
        map --mode tab_move l     move_tab_forward

        # Exit tab_move -> back to tab
        map --mode tab_move esc pop_keyboard_mode
        map --mode tab_move enter pop_keyboard_mode

        # Exit tab mode
        map --mode tab esc pop_keyboard_mode

        # Goto Tab number
        map ctrl+shift+1 goto_tab 1
        map ctrl+shift+2 goto_tab 2
        map ctrl+shift+3 goto_tab 3
        map ctrl+shift+4 goto_tab 4
        map ctrl+shift+5 goto_tab 5
        map ctrl+shift+6 goto_tab 6
        map ctrl+shift+7 goto_tab 7
        map ctrl+shift+8 goto_tab 8
        map ctrl+shift+9 goto_tab 9

    # }}} Tab Mode

    # Leader Mode {{{
        # alt+/ come il leader di zellij: un tasto, un'azione, poi la modalità finisce
        map --new-mode leader --on-action end alt+/
        # Ricerca incrementale live
        map --mode leader s launch --location=hsplit --allow-remote-control kitty +kitten plugins/search.py @active-kitty-window-id
        map --mode leader esc pop_keyboard_mode

        # Font: alt+/ poi f; resta attiva per premere +/- più volte, esc per uscire
        map --new-mode font --mode leader f
        map --mode font equal change_font_size all +1.0
        map --mode font plus change_font_size all +1.0
        map --mode font minus change_font_size all -1.0
        map --mode font 0 change_font_size all 0
        map --mode font esc pop_keyboard_mode

        # Scrollback: alt+/ poi h; resta attiva per scorrere, l e n escono e aprono less o neovim
        map --new-mode scrollback --mode leader h
        map --mode scrollback up scroll_line_up smooth
        map --mode scrollback down scroll_line_down smooth
        map --mode scrollback page_up scroll_line_up
        map --mode scrollback page_down scroll_line_down
        map --mode scrollback l combine : pop_keyboard_mode : show_scrollback
        map --mode scrollback n combine : pop_keyboard_mode : kitty_scrollback_nvim
        map --mode scrollback esc pop_keyboard_mode

        # Impostazioni: alt+/ poi S (shift+s) entra nella modalità config del blocco Setting
        map --mode leader shift+s push_keyboard_mode config

        # Nuova finestra OS nella cartella corrente: alt+/ poi n
        map --mode leader n new_os_window_with_cwd

        # Copy mode come LEADER c di WezTerm: scrollback in Neovim, v seleziona, y copia
        map --mode leader c kitty_scrollback_nvim

        # Hints: alt+/ poi i; un tasto mostra le etichette sullo schermo, poi la modalità finisce
        # y e f come il Quick Select di WezTerm (LEADER y, LEADER f)
        map --new-mode hints --mode leader --on-action end i
        map --mode hints o open_url_with_hints
        map --mode hints y kitten hints --type word --program @
        map --mode hints f kitten hints --type linenum
        map --mode hints shift+f kitten hints --type path
        map --mode hints w kitten hints --type word --program -
        map --mode hints l kitten hints --type line --program -
        map --mode hints h kitten hints --type hash --program -
        map --mode hints esc pop_keyboard_mode
    # }}} Leader Mode

    # Setting {{{
        map --new-mode config ctrl+shift+s --on-unknown passthrough
        map ctrl+shift+s combine : push_keyboard_mode config
        map --mode config r combine : load_config_file : pop_keyboard_mode
        map --mode config d combine : debug_config : pop_keyboard_mode
        map --mode config esc combine : pop_keyboard_mode
    # }}} Setting

# }}} Keyboard mappings

