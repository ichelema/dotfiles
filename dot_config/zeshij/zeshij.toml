# zeshij.toml — sessioni Zellij dei progetti (Linux).
# Picker: Alt s. Pipe: zellij pipe --plugin zeshij -- "<comando>".
# /Dati è un link a /mnt/data: i path usano la grafia che zoxide conosce già.
# Niente startup_command né windows: con questi zeshij genera un layout suo e le sessioni
# non usano il default_layout di Zellij.

[tui]
show_icons = true
# Le tab in grigio accanto alle sessioni aperte.
show_windows = true
# Pannello del picker (un intero = colonne, "80%" = percentuale dello schermo).
# Largo perché la preview (Tab) mostri lo schermo delle sessioni aperte: la lista tiene al
# massimo 60 colonne, il resto va alla preview.
width = "95%"
height = "90%"

[default_session]
# Preview delle cartelle (Tab nel picker, `zeshij preview <nome>`).
preview_command = "eza --all --git --icons=always --color=always {}"

# ---- progetti ----------------------------------------------------------------------------

[[session]]
name = "trinity"
path = "/Dati/AI/Claude/Trinity"
alias = "t"

[[session]]
name = "zeshij"
path = "/mnt/data/Sviluppo/Progetti/zesh"
alias = "z"

[[session]]
name = "hindsight-mod"
path = "/Dati/AI/Claude/hindsight-mod"
alias = "h"

# ---- configurazione e note ---------------------------------------------------------------

[[session]]
name = "dotfiles"
path = "~/.local/share/chezmoi"
alias = "d"

[[session]]
name = "claude"
path = "~/.claude"
alias = "c"

[[session]]
name = "obsidian"
path = "/mnt/data/Obsidian"
alias = "o"
