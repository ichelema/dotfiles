# Su Windows nvim legge %LOCALAPPDATA%\nvim: una junction punta qui
# (vedi .chezmoiscripts/run_onchange_after_windows-junctions.sh.tmpl).
[".config/nvim"]
    type = "git-repo"
    url = "git@github.com:ichelema/neovim_config.git"
    refreshPeriod = "2h"

# Plugin zsh (config zsh solo Windows: su Linux li esclude .chezmoiignore)
[".config/zsh/plugins/fast-syntax-highlighting"]
    type = "git-repo"
    url = "https://github.com/zdharma-continuum/fast-syntax-highlighting"
    refreshPeriod = "168h"

[".config/zsh/plugins/fzf-tab"]
    type = "git-repo"
    url = "https://github.com/Aloxaf/fzf-tab.git"
    refreshPeriod = "168h"

[".config/zsh/plugins/zsh-autosuggestions"]
    type = "git-repo"
    url = "https://github.com/zsh-users/zsh-autosuggestions"
    refreshPeriod = "168h"
