general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  forward_client_headers_to_llm_api: true  # Required: forwards OAuth token to Anthropic


litellm_settings:
  callbacks: callbacks.proxy_handler_instance
  drop_params: true
  # 300s per allinearsi ad API_TIMEOUT_MS di Claude Code (era 60): sol-ultra e'
  # multi-agente e sui compiti complessi sfora il minuto. Misurato il 2026-07-15
  # sulle chiamate reali: media 13.9s ma massimo 71.6s, con 2 chiamate oltre 45s.
  request_timeout: 300
  model_group_settings:
    forward_client_headers_to_llm_api:
      - "claude-sonnet*"
      - "claude-opus*"
      - "claude-haiku*"
      - "claude-fable*"
