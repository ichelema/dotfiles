  # =========================
  # Kimi K3 via OpenRouter
  # =========================
  # Reasoning sempre attivo; effort: low | high | max (default max)
  # Sampling fisso (temperature/top_p non modificabili)
  # Costo: $3/MTok input, $15/MTok output, $0.30/MTok cache read
  # Prezzi verificati il 2026-07-29 su GET https://openrouter.ai/api/v1/models:
  # prompt 3e-6, completion 15e-6, input_cache_read 3e-7. Il campo
  # input_cache_write non esiste -> la scrittura in cache non e' addebitata,
  # quindi cache_creation_input_token_cost: 0 e' il valore reale.
  
  - model_name: claude-kimi-k3-low
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 262144
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0.0000003
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning_effort: low
      extra_body:
        reasoning:
            exclude: false

  - model_name: claude-kimi-k3-high
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 262144
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0.0000003
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      reasoning_effort: high
      extra_body:
        reasoning:
            exclude: false

  - model_name: claude-kimi-k3-max
    model_info:
      max_input_tokens: 1000000
      max_output_tokens: 262144
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0.0000003
    litellm_params:
      model: openrouter/moonshotai/kimi-k3
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body:
        reasoning:
            exclude: false



  # =========================
  # DeepSeek via DeepSeek API
  # =========================
  # Unico modello unificato: deepseek-flash (V4.1 Flash). Il reasoning e'
  # sempre attivo (reasoning_content presente anche senza parametro
  # `thinking`), quindi non servono alias separati per il thinking.
  # Prezzi peak per MTok (off-peak = meta'): input 0.30, output 1.20,
  # cache hit 0.006. Cache write non addebitata -> 0.
  # Verificato il 2026-09-24 su GET https://api.deepseek.com/models.

  - model_name: claude-deepseek-flash
    model_info:
      supports_vision: true
      max_input_tokens: 1000000
      max_output_tokens: 384000
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0.000000006
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

