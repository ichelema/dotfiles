  # NB 'minimal' e 'none' NON sono supportati da questi modelli; gpt-5.5 arriva

  # Flagship — lavoro pesante (default del modello: low)
  - model_name: claude-gpt-5-6-sol-high
    model_info:
      mode: responses
      max_input_tokens: 794000
      max_output_tokens: 128000
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_creation_input_token_cost: 0
      cache_read_input_token_cost: 0
    litellm_params:
      model: chatgpt/gpt-5.6-sol
      reasoning_effort:
        effort: high

